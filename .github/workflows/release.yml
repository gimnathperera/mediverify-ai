name: Release images

# Builds versioned images on tags. Pushing to GHCR only happens when the repository variable
# PUBLISH_IMAGES is 'true' — off by default, so nothing is published without an explicit opt-in.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: docker/node.Dockerfile, target: api }
          - { name: worker, file: docker/node.Dockerfile, target: worker }
          - { name: web, file: docker/web.Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: vars.PUBLISH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ vars.PUBLISH_IMAGES == 'true' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
