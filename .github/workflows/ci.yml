name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Format · Lint · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck # packages + root scripts/tests

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mediverify
          POSTGRES_PASSWORD: mediverify
          POSTGRES_DB: mediverify
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U mediverify" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://mediverify:mediverify@localhost:55432/mediverify_test
      TEST_ADMIN_DATABASE_URL: postgres://mediverify:mediverify@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: embed-model-bge-small-en-v1.5-q8
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Retrieval / classification evaluation (fixture LLM)
        run: pnpm eval -- --out eval-report.json
        env:
          DATABASE_URL: postgres://mediverify:mediverify@localhost:55432/mediverify_test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval-report.json, if-no-files-found: ignore }

  compose-e2e:
    name: Docker Compose smoke + Playwright E2E
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      LLM_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { E2E_BASE_URL: 'http://localhost:8088' }
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-debug
          path: |
            playwright-report
            test-results
            compose-logs.txt
      - run: docker compose down -v
        if: always()

  security:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (report only)
        run: pnpm audit --audit-level=high || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-live:
    name: Live-model golden evaluation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: mediverify, POSTGRES_PASSWORD: mediverify, POSTGRES_DB: mediverify }
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U mediverify" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:live -- --out eval-live.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: postgres://mediverify:mediverify@localhost:55432/mediverify
      - uses: actions/upload-artifact@v4
        with: { name: eval-live, path: eval-live.json }
