version: 2
# Major upgrades (TypeScript, Vite, NestJS, react-pdf, transformers, Node, nginx) change APIs or runtime behaviour
# and are done deliberately by hand, not by bot PRs. Dependabot keeps minor/patch and security updates flowing.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
